# Where `mage` looks for the core library.
#
# `relative = true` resolves against this file's directory, so it is right for
# `cargo run`, for `cargo test`, and inside the nix check sandbox where the
# source is copied to an arbitrary path — none of which have a working
# directory worth relying on.
#
# This also sets the variable while the binary is being built, which is what
# `option_env!("ARCANA_CORE_LIB_PATH")` bakes in as a fallback so that running
# ./target/debug/mage directly works without a wrapper.
[env]
ARCANA_CORE_LIB_PATH = { value = "core", relative = true }

# Type checking recurses roughly in step with how nested the types are, and the
# core library now carries `Map`, whose `imp` is deep enough to overflow the
# 2 MiB the test harness gives a thread. `mage` itself has always sidestepped
# this by running on a thread it sizes explicitly (`STACK_SIZE` in main.rs);
# test threads are spawned by the harness, so the only way to size them is here.
#
# This is a prop, not a fix: the checker's stack use is the real problem, and a
# core library that keeps growing will meet this limit again.
[env.RUST_MIN_STACK]
value = "8388608"
force = false
